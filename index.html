<!DOCTYPE html>
<html>
<head>
    <title>Kreo Support</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; background: #f5f5f5; }
        h2 { color: #111; }
        #chatbox { background: white; border-radius: 8px; padding: 16px; height: 400px; overflow-y: auto; border: 1px solid #ddd; margin-bottom: 12px; }
        .msg { margin: 8px 0; padding: 8px 12px; border-radius: 6px; max-width: 80%; }
        .user { background: #DCF8C6; margin-left: auto; text-align: right; }
        .agent { background: #eee; }
        #inputRow { display: flex; gap: 8px; }
        #questionInput { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #ccc; }
        button { padding: 10px 16px; border: none; background: #111; color: white; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Kreo Support Chat</h2>
    <div id="chatbox"></div>
    <div id="inputRow">
        <input type="text" id="questionInput" placeholder="Ask about returns, warranty, products..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatbox = document.getElementById("chatbox");
        const input = document.getElementById("questionInput");

        function addMessage(text, sender) {
            const div = document.createElement("div");
            div.className = "msg " + sender;
            div.textContent = text;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        async function sendMessage() {
            const question = input.value.trim();
            if (!question) return;
            addMessage(question, "user");
            input.value = "";
            addMessage("Typing...", "agent");

            const response = await fetch("http://127.0.0.1:8000/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: question })
            });
            const data = await response.json();

            chatbox.removeChild(chatbox.lastChild); // remove "Typing..."
            addMessage(data.answer, "agent");
        }

        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
